<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flyer</title>
<style>
@font-face{
  font-family:'Inter';
  src:url('Inter.ttf') format('truetype');
  font-weight:100 900;
  font-style:normal;
  font-display:block;
}
:root{
  --s:1;
  --navy:#1B2A5C;
  --red:#D0202E;
  --pad:calc(46px * var(--s));
  --gap:calc(30px * var(--s));
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#fff;}
body{
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#flyer{
  position:relative;
  overflow:hidden;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:space-between;
}

/* ---------- 1. headline ---------- */
.headline{
  padding:var(--pad) var(--pad) 0;
  font-size:calc(76px * var(--s));
  line-height:1.05;
  font-weight:800;
  letter-spacing:calc(-0.018em);
  color:var(--navy);
  text-wrap:balance;
}
.headline .hl{color:var(--red);}

/* ---------- 2. photo band ---------- */
.photoband{
  width:100%;
  flex:1 1 auto;
  min-height:calc(130px * var(--s));
  max-height:38%;
  margin-top:calc(var(--gap) * 0.95);
  overflow:hidden;
  background:var(--navy);
  position:relative;
}
.photoband img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 80%;
}

/* ---------- 3. candidate columns ---------- */
.cands{
  display:flex;
  width:100%;
  padding:calc(var(--gap) * 1.05) var(--pad) 0;
  gap:calc(20px * var(--s));
}
.cand{
  flex:1 1 0;
  min-width:0;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:calc(7px * var(--s));
}
.cand .rule{
  width:calc(64px * var(--s));
  height:calc(6px * var(--s));
  background:var(--red);
  border-radius:calc(4px * var(--s));
  margin-bottom:calc(4px * var(--s));
}
.cand .nm{
  font-size:calc(33px * var(--s));
  font-weight:800;
  line-height:1.1;
  color:var(--navy);
  letter-spacing:-0.01em;
  white-space:nowrap;
}
.cand .rl{
  font-size:calc(21px * var(--s));
  font-weight:600;
  line-height:1.15;
  color:#5C6684;
  letter-spacing:0.04em;
  text-transform:uppercase;
  white-space:nowrap;
}

/* ---------- 4. CTA bar ---------- */
.cta{
  width:100%;
  margin-top:calc(var(--gap) * 1.1);
  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(22px * var(--s));
  padding:calc(24px * var(--s)) var(--pad);
}
.cta img{
  display:block;
  width:calc(62px * var(--s));
  height:calc(48.7px * var(--s));
  flex:none;
}
.cta span{
  font-size:calc(46px * var(--s));
  font-weight:900;
  letter-spacing:calc(0.05em);
  color:#fff;
  line-height:1;
  white-space:nowrap;
}

/* ---------- 5. steps ---------- */
.steps{
  width:100%;
  padding:calc(var(--gap) * 1.05) var(--pad) 0;
  display:flex;
  flex-direction:column;
  gap:calc(18px * var(--s));
}
.step{
  display:flex;
  align-items:center;
  gap:calc(16px * var(--s));
}
.step img{
  display:block;
  width:calc(36px * var(--s));
  height:calc(36px * var(--s));
  flex:none;
}
.step span{
  font-size:calc(26px * var(--s));
  font-weight:600;
  line-height:1.2;
  color:var(--navy);
  min-width:0;
}

/* ---------- 6. footer ---------- */
.footer{
  width:100%;
  padding:calc(var(--gap) * 0.95) var(--pad) var(--pad);
  font-size:calc(19px * var(--s));
  font-weight:500;
  line-height:1.25;
  color:#6B7391;
  letter-spacing:0.01em;
}
</style>
</head>
<body>
<div id="flyer">
  <h1 class="headline">Proven <span class="hl">RESULTS</span> for <span class="hl">WILLOWMERE</span> Families</h1>

  <div class="photoband"><img src="photo.png" alt=""></div>

  <div class="cands">
    <div class="cand"><div class="rule"></div><div class="nm">Dana Levi</div><div class="rl">Mayor</div></div>
    <div class="cand"><div class="rule"></div><div class="nm">Omar Haddad</div><div class="rl">Council</div></div>
    <div class="cand"><div class="rule"></div><div class="nm">Ruth Cohen</div><div class="rl">Council</div></div>
  </div>

  <div class="cta">
    <img src="mail.svg" alt="">
    <span>VOTE BY MAIL</span>
  </div>

  <div class="steps">
    <div class="step"><img src="check.svg" alt=""><span>Request your ballot by October&nbsp;20</span></div>
    <div class="step"><img src="check.svg" alt=""><span>Fill it out at home</span></div>
    <div class="step"><img src="check.svg" alt=""><span>Mail it back by November&nbsp;3</span></div>
  </div>

  <div class="footer">Paid for by Willowmere Forward&nbsp;· willowmereforward.org</div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var w = +q.get('w') || 1080, h = +q.get('h') || 1350, s = +q.get('s') || 1;
  var f = document.getElementById('flyer');
  document.documentElement.style.setProperty('--s', s);
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  document.body.style.width = w + 'px';
  document.body.style.height = h + 'px';
})();
</script>
</body>
</html>
