<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('Inter.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px;
    overflow: hidden;
    background: #ffffff;
  }
  .stage {
    width: 1080px;
    height: 1350px;
    transform: scale(1);
    transform-origin: top left;
    font-family: 'Inter', sans-serif;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  .pad { padding-left: 58px; padding-right: 58px; }

  /* 1. Headline */
  .headline {
    font-size: 76px;
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #1B2A5C;
    text-wrap: balance;
    padding-bottom: 34px;
  }
  .headline .hl { color: #D0202E; }

  /* 2. Photo band */
  .photoband {
    width: 100%;
    height: 330px;
    flex: 0 0 auto;
    overflow: hidden;
    background: #1B2A5C;
  }
  .photoband img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
    display: block;
  }

  /* 3. Candidate columns */
  .cands {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 30px;
    align-items: start;
    padding-top: 36px;
    padding-bottom: 36px;
  }
  .cand { text-align: center; }
  .cand .rule {
    width: 64px; height: 7px;
    background: #D0202E;
    border-radius: 4px;
    margin: 0 auto 16px;
  }
  .cand .nm {
    font-size: 38px;
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -0.015em;
    color: #1B2A5C;
    white-space: nowrap;
  }
  .cand .rl {
    font-size: 23px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #D0202E;
    margin-top: 8px;
    white-space: nowrap;
  }

  /* 4. CTA bar */
  .cta {
    width: 100%;
    flex: 0 0 auto;
    background: #D0202E;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 28px 40px;
  }
  .cta img { width: 56px; height: 44px; display: block; flex: 0 0 auto; }
  .cta span {
    font-size: 52px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #ffffff;
    white-space: nowrap;
  }

  /* 5. Steps */
  .steps {
    padding-top: 36px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .step img { width: 40px; height: 40px; display: block; flex: 0 0 auto; }
  .step span {
    font-size: 30px;
    line-height: 1.25;
    font-weight: 600;
    color: #1B2A5C;
  }

  /* 6. Footer */
  .footer {
    padding-top: 36px;
    font-size: 21px;
    line-height: 1.3;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: #6B7280;
  }
</style>
</head>
<body>
  <div class="stage">

    <h1 class="headline pad">Proven <span class="hl">RESULTS</span> for <span class="hl">WILLOWMERE</span> Families</h1>

    <div class="photoband"><img src="photo.png" alt=""></div>

    <div class="cands pad">
      <div class="cand"><div class="rule"></div><div class="nm">Dana Levi</div><div class="rl">Mayor</div></div>
      <div class="cand"><div class="rule"></div><div class="nm">Omar Haddad</div><div class="rl">Council</div></div>
      <div class="cand"><div class="rule"></div><div class="nm">Ruth Cohen</div><div class="rl">Council</div></div>
    </div>

    <div class="cta"><img src="mail.svg" alt=""><span>VOTE BY MAIL</span></div>

    <div class="steps pad">
      <div class="step"><img src="check.svg" alt=""><span>Request your ballot by October 20</span></div>
      <div class="step"><img src="check.svg" alt=""><span>Fill it out at home</span></div>
      <div class="step"><img src="check.svg" alt=""><span>Mail it back by November 3</span></div>
    </div>

    <div class="footer pad">Paid for by Willowmere Forward &middot; willowmereforward.org</div>

  </div>
</body>
</html>
