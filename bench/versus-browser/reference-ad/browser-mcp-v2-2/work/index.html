<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flyer</title>
<style>
  @font-face{
    font-family:'Inter';
    src:url('Inter.ttf') format('truetype');
    font-weight:100 900;
    font-style:normal;
    font-display:block;
  }
  :root{
    --navy:#1B2A5C;
    --red:#D0202E;
    --pad:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#ffffff;}
  body{overflow:hidden;}
  #stage{position:relative;overflow:hidden;background:#fff;}
  #root{
    position:absolute;top:0;left:0;
    transform-origin:top left;
    background:#fff;
    font-family:'Inter',sans-serif;
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  .sp{flex:1 1 36px;min-height:10px;}
  .sp.top{flex:1 1 52px;min-height:16px;}
  .sp.bot{flex:1 1 44px;min-height:14px;}

  /* 1. headline */
  .headline{
    flex:0 0 auto;
    padding:0 var(--pad);
    color:var(--navy);
    font-size:76px;
    line-height:1.07;
    font-weight:800;
    letter-spacing:-0.02em;
    text-wrap:balance;
  }
  .headline em{color:var(--red);font-style:normal;}

  /* 2. photo band */
  .photoband{
    flex:3 1 340px;
    min-height:190px;
    width:100%;
    overflow:hidden;
    position:relative;
    background:var(--navy);
  }
  .photoband img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;object-position:50% 58%;
    display:block;
  }

  /* 3. candidates */
  .cands{
    flex:0 0 auto;
    padding:0 var(--pad);
    display:flex;
    align-items:stretch;
    gap:28px;
  }
  .cand{
    flex:1 1 0;
    min-width:0;
    text-align:center;
    border-top:5px solid var(--navy);
    padding-top:18px;
  }
  .cand .nm{
    color:var(--navy);
    font-size:37px;
    font-weight:800;
    line-height:1.12;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  .cand .rl{
    margin-top:7px;
    color:var(--red);
    font-size:23px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    line-height:1.2;
  }

  /* 4. CTA */
  .cta{
    flex:0 0 auto;
    width:100%;
    background:var(--red);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:26px var(--pad);
  }
  .cta img{width:56px;height:44px;display:block;flex:0 0 auto;}
  .cta span{
    color:#fff;
    font-size:54px;
    font-weight:800;
    letter-spacing:.07em;
    line-height:1.05;
    white-space:nowrap;
  }

  /* 5. steps */
  .steps{
    flex:0 0 auto;
    padding:0 var(--pad);
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .step{
    display:flex;
    align-items:center;
    gap:22px;
  }
  .step img{width:40px;height:40px;flex:0 0 auto;display:block;}
  .step span{
    color:var(--navy);
    font-size:31px;
    font-weight:600;
    line-height:1.25;
  }

  /* 6. footer */
  .footer{
    flex:0 0 auto;
    padding:0 var(--pad);
    color:#5B6480;
    font-size:21px;
    font-weight:500;
    letter-spacing:.01em;
    line-height:1.3;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="root">
    <div class="sp top"></div>

    <h1 class="headline">Proven <em>RESULTS</em> for <em>WILLOWMERE</em> Families</h1>

    <div class="sp"></div>

    <div class="photoband"><img src="photo.png" alt=""></div>

    <div class="sp"></div>

    <div class="cands">
      <div class="cand"><div class="nm">Dana Levi</div><div class="rl">Mayor</div></div>
      <div class="cand"><div class="nm">Omar Haddad</div><div class="rl">Council</div></div>
      <div class="cand"><div class="nm">Ruth Cohen</div><div class="rl">Council</div></div>
    </div>

    <div class="sp"></div>

    <div class="cta">
      <img src="mail.svg" alt=""><span>VOTE BY MAIL</span>
    </div>

    <div class="sp"></div>

    <div class="steps">
      <div class="step"><img src="check.svg" alt=""><span>Request your ballot by October&nbsp;20</span></div>
      <div class="step"><img src="check.svg" alt=""><span>Fill it out at home</span></div>
      <div class="step"><img src="check.svg" alt=""><span>Mail it back by November&nbsp;3</span></div>
    </div>

    <div class="sp"></div>

    <div class="footer">Paid for by Willowmere Forward&nbsp;· willowmereforward.org</div>

    <div class="sp bot"></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const W = +(q.get('w') || 1080);
  const H = +(q.get('h') || 1350);
  const S = +(q.get('s') || 1);
  const stage = document.getElementById('stage');
  const root  = document.getElementById('root');
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';
  root.style.width  = (W / S) + 'px';
  root.style.height = (H / S) + 'px';
  root.style.transform = 'scale(' + S + ')';
  document.documentElement.style.setProperty('--pad', Math.round(64) + 'px');
  document.body.dataset.ready = '1';
</script>
</body>
</html>
