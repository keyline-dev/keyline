<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flyer</title>
<style>
  @font-face{
    font-family:'Inter';
    src:url('Inter.ttf') format('truetype');
    font-weight:100 900;
    font-display:block;
  }
  :root{
    --navy:#1B2A5C;
    --red:#D0202E;
    --pad:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#fff}
  body{overflow:hidden}
  #stage{position:relative;overflow:hidden;background:#fff}
  #root{
    position:absolute;top:0;left:0;
    transform-origin:top left;
    background:#fff;
    display:flex;flex-direction:column;
    justify-content:center;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    color:var(--navy);
  }
  /* flexible spacers: absorb leftover height, capped */
  .sp{flex:1 1 0;min-height:18px;max-height:calc(var(--lh) * 0.07)}
  .sp.lg{max-height:calc(var(--lh) * 0.09)}

  /* 1. headline */
  .headline{
    padding:0 var(--pad);
    font-size:72px;
    line-height:1.08;
    font-weight:800;
    letter-spacing:-1.2px;
    text-align:center;
    text-wrap:balance;
  }
  .headline .r{color:var(--red)}

  /* 2. photo band */
  .photo{
    flex:1 1 auto;
    width:100%;
    height:330px;
    min-height:230px;
    max-height:calc(var(--lh) * 0.32);
    overflow:hidden;
    background:var(--navy);
  }
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}

  /* 3. candidates */
  .cands{
    display:flex;
    width:100%;
    padding:0 var(--pad);
  }
  .cand{flex:1 1 0;min-width:0;text-align:center;padding:0 10px}
  .cand .nm{font-size:38px;font-weight:700;line-height:1.14;letter-spacing:-0.5px}
  .cand .rl{
    margin-top:10px;font-size:23px;font-weight:700;color:var(--red);
    text-transform:uppercase;letter-spacing:1.6px;line-height:1.2;
  }
  .cand .rule{width:54px;height:4px;background:var(--red);margin:14px auto 0;border-radius:2px}

  /* 4. CTA bar */
  .cta{
    width:100%;
    background:var(--red);
    display:flex;align-items:center;justify-content:center;
    gap:28px;
    padding:28px var(--pad);
    flex:0 0 auto;
  }
  .cta img{width:56px;height:44px;display:block;flex:0 0 auto}
  .cta span{
    color:#fff;font-size:50px;font-weight:800;letter-spacing:3px;
    line-height:1.1;white-space:nowrap;
  }

  /* 5. steps */
  .steps{
    padding:0 var(--pad);
    display:flex;flex-direction:column;
    gap:22px;
    width:100%;
  }
  .step{display:flex;align-items:center;gap:20px}
  .step img{width:40px;height:40px;flex:0 0 auto;display:block}
  .step span{font-size:31px;font-weight:600;line-height:1.24}

  /* 6. footer */
  .footer{
    padding:0 var(--pad);
    text-align:center;
    font-size:22px;
    font-weight:500;
    line-height:1.3;
    color:#58637F;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="root">
    <div class="sp"></div>

    <h1 class="headline">Proven <span class="r">RESULTS</span> for <span class="r">WILLOWMERE</span> Families</h1>

    <div class="sp"></div>

    <div class="photo"><img src="photo.jpg" alt=""></div>

    <div class="sp lg"></div>

    <div class="cands">
      <div class="cand"><div class="nm">Dana Levi</div><div class="rl">Mayor</div><div class="rule"></div></div>
      <div class="cand"><div class="nm">Omar Haddad</div><div class="rl">Council</div><div class="rule"></div></div>
      <div class="cand"><div class="nm">Ruth Cohen</div><div class="rl">Council</div><div class="rule"></div></div>
    </div>

    <div class="sp lg"></div>

    <div class="cta">
      <img src="mail.svg" alt="">
      <span>VOTE BY MAIL</span>
    </div>

    <div class="sp lg"></div>

    <div class="steps">
      <div class="step"><img src="check.svg" alt=""><span>Request your ballot by October 20</span></div>
      <div class="step"><img src="check.svg" alt=""><span>Fill it out at home</span></div>
      <div class="step"><img src="check.svg" alt=""><span>Mail it back by November 3</span></div>
    </div>

    <div class="sp"></div>

    <div class="footer">Paid for by Willowmere Forward · willowmereforward.org</div>

    <div class="sp"></div>
  </div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var W = parseFloat(q.get('w') || 1080);
  var H = parseFloat(q.get('h') || 1350);
  var S = parseFloat(q.get('s') || 1);
  var lw = W / S, lh = H / S;
  var stage = document.getElementById('stage');
  var root = document.getElementById('root');
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';
  root.style.setProperty('--lh', lh + 'px');
  root.style.width = lw + 'px';
  root.style.height = lh + 'px';
  root.style.transform = 'scale(' + S + ')';
  document.body.style.width = W + 'px';
  document.body.style.height = H + 'px';
  document.documentElement.setAttribute('data-ready','1');
})();
</script>
</body>
</html>
