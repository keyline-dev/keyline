<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Inter';
  src: url('Inter.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
}
:root { --s: __SCALE__; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  color: #1B2A5C;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.pad { padding-left: calc(48px * var(--s)); padding-right: calc(48px * var(--s)); }

/* 1. Headline */
.headline {
  padding-top: calc(44px * var(--s));
  padding-bottom: calc(30px * var(--s));
  font-size: calc(62px * var(--s));
  line-height: 1.08;
  font-weight: 800;
  letter-spacing: calc(-0.8px * var(--s));
  color: #1B2A5C;
  text-wrap: balance;
}
.headline .r { color: #D0202E; }

/* 2. Photo band */
.photoband {
  width: 100%;
  flex: 1 1 auto;
  min-height: calc(130px * var(--s));
  max-height: 50vh;
  overflow: hidden;
  background: #1B2A5C;
  position: relative;
}
.photoband img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 42%;
  display: block;
}

/* 3. Candidates */
.cands {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  gap: calc(20px * var(--s));
  padding-top: calc(34px * var(--s));
  padding-bottom: calc(34px * var(--s));
}
.cand {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  border-top: calc(5px * var(--s)) solid #D0202E;
  padding-top: calc(16px * var(--s));
}
.cand .nm {
  font-size: calc(30px * var(--s));
  line-height: 1.15;
  font-weight: 800;
  color: #1B2A5C;
  letter-spacing: calc(-0.3px * var(--s));
  white-space: nowrap;
}
.cand .rl {
  margin-top: calc(7px * var(--s));
  font-size: calc(18px * var(--s));
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: calc(1.4px * var(--s));
  text-transform: uppercase;
  color: #D0202E;
  white-space: nowrap;
}

/* 4. CTA bar */
.cta {
  width: 100%;
  background: #D0202E;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(22px * var(--s));
  padding: calc(26px * var(--s)) calc(20px * var(--s));
}
.cta img { width: calc(56px * var(--s)); height: calc(44px * var(--s)); display: block; }
.cta span {
  font-size: calc(46px * var(--s));
  line-height: 1.12;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: calc(2.5px * var(--s));
  white-space: nowrap;
}

/* 5. Steps */
.steps {
  padding-top: calc(32px * var(--s));
  padding-bottom: calc(28px * var(--s));
  display: flex;
  flex-direction: column;
  gap: calc(20px * var(--s));
}
.step { display: flex; align-items: center; gap: calc(18px * var(--s)); }
.step img { width: calc(40px * var(--s)); height: calc(40px * var(--s)); flex: 0 0 auto; display: block; }
.step span {
  font-size: calc(27px * var(--s));
  line-height: 1.25;
  font-weight: 600;
  color: #1B2A5C;
  min-width: 0;
}

/* 6. Footer */
.footer {
  border-top: calc(2px * var(--s)) solid #D6DAE6;
  padding-top: calc(20px * var(--s));
  padding-bottom: calc(30px * var(--s));
  font-size: calc(19px * var(--s));
  line-height: 1.3;
  font-weight: 500;
  color: #5A6485;
  text-align: center;
}
</style>
</head>
<body>
  <div class="pad">
    <h1 class="headline">Proven <span class="r">RESULTS</span> for <span class="r">WILLOWMERE</span> Families</h1>
  </div>

  <div class="photoband"><img src="photo.png" alt=""></div>

  <div class="pad cands">
    <div class="cand"><div class="nm">Dana Levi</div><div class="rl">Mayor</div></div>
    <div class="cand"><div class="nm">Omar Haddad</div><div class="rl">Council</div></div>
    <div class="cand"><div class="nm">Ruth Cohen</div><div class="rl">Council</div></div>
  </div>

  <div class="cta">
    <img src="mail.svg" alt="">
    <span>VOTE BY MAIL</span>
  </div>

  <div class="pad steps">
    <div class="step"><img src="check.svg" alt=""><span>Request your ballot by October 20</span></div>
    <div class="step"><img src="check.svg" alt=""><span>Fill it out at home</span></div>
    <div class="step"><img src="check.svg" alt=""><span>Mail it back by November 3</span></div>
  </div>

  <div class="pad footer">Paid for by Willowmere Forward &middot; willowmereforward.org</div>
</body>
</html>
