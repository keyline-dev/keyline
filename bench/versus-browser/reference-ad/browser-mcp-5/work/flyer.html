<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flyer</title>
<style>
@font-face{
  font-family:'Inter';
  src:url('Inter.ttf') format('truetype');
  font-weight:100 900;
  font-style:normal;
  font-display:block;
}
:root{
  --s:1;
  --navy:#1B2A5C;
  --red:#D0202E;
  --padx:calc(64px * var(--s));
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;}
body{
  font-family:'Inter',sans-serif;
  color:var(--navy);
  -webkit-font-smoothing:antialiased;
}
#flyer{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  background:#fff;
}
/* 1. headline */
.head{
  padding:calc(54px * var(--s)) var(--padx) calc(36px * var(--s));
  flex:0 0 auto;
}
.head h1{
  font-size:calc(74px * var(--s));
  line-height:1.06;
  font-weight:800;
  letter-spacing:calc(-0.018em);
  text-wrap:balance;
}
.head .r{color:var(--red);}

/* 2. photo band */
.band{
  flex:1 1 auto;
  min-height:calc(110px * var(--s));
  max-height:46%;
  width:100%;
  overflow:hidden;
  background:var(--navy);
}
.band img{
  width:100%;height:100%;
  object-fit:cover;object-position:50% 72%;
  display:block;
}

/* 3. candidates */
.cands{
  flex:0 0 auto;
  padding:calc(38px * var(--s)) var(--padx);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:calc(26px * var(--s));
}
.cand{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;}
.cand .bar{
  width:calc(46px * var(--s));
  height:calc(4px * var(--s));
  background:var(--red);
  border-radius:calc(2px * var(--s));
  margin-bottom:calc(14px * var(--s));
}
.cand .nm{
  font-size:calc(34px * var(--s));
  font-weight:700;
  line-height:1.15;
  white-space:nowrap;
}
.cand .rl{
  margin-top:calc(6px * var(--s));
  font-size:calc(20px * var(--s));
  font-weight:600;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:#5a6486;
  white-space:nowrap;
}

/* 4. CTA bar */
.cta{
  flex:0 0 auto;
  width:100%;
  background:var(--red);
  padding:calc(26px * var(--s)) var(--padx);
  display:flex;align-items:center;justify-content:center;
  gap:calc(22px * var(--s));
}
.cta img{
  width:calc(56px * var(--s));
  height:calc(44px * var(--s));
  display:block;
  flex:0 0 auto;
}
.cta span{
  color:#fff;
  font-size:calc(52px * var(--s));
  font-weight:800;
  letter-spacing:0.05em;
  line-height:1;
  white-space:nowrap;
}

/* 5. steps */
.steps{
  flex:0 0 auto;
  padding:calc(38px * var(--s)) var(--padx) 0;
  display:flex;flex-direction:column;
  gap:calc(22px * var(--s));
}
.step{display:flex;align-items:center;gap:calc(20px * var(--s));}
.step img{
  width:calc(40px * var(--s));
  height:calc(40px * var(--s));
  flex:0 0 auto;display:block;
}
.step span{
  font-size:calc(27px * var(--s));
  font-weight:500;
  line-height:1.25;
}

/* 6. footer */
.foot{
  flex:0 0 auto;
  padding:calc(34px * var(--s)) var(--padx) calc(30px * var(--s));
  font-size:calc(19px * var(--s));
  font-weight:500;
  color:#6a7392;
  letter-spacing:0.01em;
  white-space:nowrap;
}
</style>
</head>
<body>
<div id="flyer">
  <header class="head">
    <h1>Proven <span class="r">RESULTS</span> for <span class="r">WILLOWMERE</span> Families</h1>
  </header>

  <div class="band"><img src="photo.png" alt=""></div>

  <section class="cands">
    <div class="cand"><div class="bar"></div><div class="nm">Dana Levi</div><div class="rl">Mayor</div></div>
    <div class="cand"><div class="bar"></div><div class="nm">Omar Haddad</div><div class="rl">Council</div></div>
    <div class="cand"><div class="bar"></div><div class="nm">Ruth Cohen</div><div class="rl">Council</div></div>
  </section>

  <div class="cta">
    <img src="mail.svg" alt=""><span>VOTE BY MAIL</span>
  </div>

  <section class="steps">
    <div class="step"><img src="check.svg" alt=""><span>Request your ballot by October&nbsp;20</span></div>
    <div class="step"><img src="check.svg" alt=""><span>Fill it out at home</span></div>
    <div class="step"><img src="check.svg" alt=""><span>Mail it back by November&nbsp;3</span></div>
  </section>

  <footer class="foot">Paid for by Willowmere Forward · willowmereforward.org</footer>
</div>
<script>
const p = new URLSearchParams(location.search);
const s = parseFloat(p.get('s') || '1');
document.documentElement.style.setProperty('--s', s);
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
