<!doctype html>
<!-- The reference ad by hand in HTML, laid out like build_reference_ad in
     tests/common/mod.rs: a likeness reference rendered by Chrome, never shown
     to an agent. The scale follows the viewport width, as the task gives it. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(Inter.ttf); font-weight: 100 900; }
:root { --s: 1; --navy: #1B2A5C; --red: #D0202E; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #fff; }
body { font-family: Inter, sans-serif; display: flex; flex-direction: column; }
.px { --u: calc(var(--s) * 1px); }
h1 { margin: calc(40 * var(--u)) calc(60 * var(--u)) 0; height: calc(180 * var(--u));
  font-size: calc(64 * var(--u)); font-weight: 800; line-height: 1.2; text-align: center; color: var(--navy); }
h1 em { font-style: normal; color: var(--red); }
.photo { flex: 1; min-height: 0; background: url(photo.jpg) center / cover; }
.names { display: flex; justify-content: space-between; padding: calc(30 * var(--u)) calc(60 * var(--u)) 0;
  height: calc(130 * var(--u)); }
.names div { width: calc(300 * var(--u)); text-align: center; }
.names b { display: block; font-size: calc(36 * var(--u)); font-weight: 700; color: var(--navy); }
.names span { display: block; font-size: calc(30 * var(--u)); font-weight: 500; color: var(--red); margin-top: calc(6 * var(--u)); }
.cta { margin-top: calc(20 * var(--u)); height: calc(100 * var(--u)); background: var(--red); display: flex;
  align-items: center; justify-content: center; gap: calc(20 * var(--u)); }
.cta img { width: calc(56 * var(--u)); height: calc(44 * var(--u)); }
.cta span { font-size: calc(48 * var(--u)); font-weight: 800; color: #fff; }
.steps { padding: calc(40 * var(--u)) calc(90 * var(--u)) 0 calc(120 * var(--u)); height: calc(310 * var(--u)); }
.steps p { display: flex; align-items: center; gap: calc(22 * var(--u)); height: calc(95 * var(--u));
  font-size: calc(32 * var(--u)); font-weight: 500; color: var(--navy); }
.steps img { width: calc(48 * var(--u)); height: calc(48 * var(--u)); }
footer { height: calc(110 * var(--u)); padding-top: calc(20 * var(--u)); text-align: center;
  font-size: calc(30 * var(--u)); color: #6B7280; }
</style>
<script>
  const w = window.innerWidth;
  document.documentElement.style.setProperty('--s', w === 1200 ? 0.85 : w === 300 ? 0.28 : 1);
</script>
</head>
<body class="px">
<h1>Proven <em>RESULTS</em> for <em>WILLOWMERE</em> Families</h1>
<div class="photo"></div>
<div class="names">
  <div><b>Dana Levi</b><span>Mayor</span></div>
  <div><b>Omar Haddad</b><span>Council</span></div>
  <div><b>Ruth Cohen</b><span>Council</span></div>
</div>
<div class="cta"><img src="mail.svg" alt=""><span>VOTE BY MAIL</span></div>
<div class="steps">
  <p><img src="check.svg" alt="">Request your ballot by October 20</p>
  <p><img src="check.svg" alt="">Fill it out at home</p>
  <p><img src="check.svg" alt="">Mail it back by November 3</p>
</div>
<footer>Paid for by Willowmere Forward · willowmereforward.org</footer>
</body>
</html>
