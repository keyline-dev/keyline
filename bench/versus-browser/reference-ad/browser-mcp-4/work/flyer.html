<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flyer</title>
<style>
  @font-face{
    font-family:'Inter';
    src:url('Inter.ttf') format('truetype');
    font-weight:100 900;
    font-style:normal;
    font-display:block;
  }
  :root{
    --navy:#1B2A5C;
    --red:#D0202E;
    --s:1;
    --pm:594px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#6b7280}
  body{display:flex;align-items:flex-start;justify-content:flex-start}

  #flyer{
    width:var(--w);
    height:var(--h);
    background:#ffffff;
    font-family:'Inter',sans-serif;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:stretch;
    padding-top:calc(56px * var(--s));
    padding-bottom:calc(48px * var(--s));
    gap:calc(38px * var(--s));
    position:relative;
  }
  /* horizontal inset used by non-band blocks */
  .pad{padding-left:calc(56px * var(--s));padding-right:calc(56px * var(--s))}

  /* 1. HEADLINE */
  h1{
    font-size:calc(78px * var(--s));
    line-height:1.08;
    letter-spacing:calc(-0.022em);
    font-weight:800;
    color:var(--navy);
    text-wrap:balance;
  }
  h1 .r{color:var(--red)}

  /* 2. PHOTO BAND */
  .photo{
    flex:1 1 0;
    min-height:calc(90px * var(--s));
    max-height:var(--pm);
    width:100%;
    overflow:hidden;
    background:var(--navy);
    display:block;
  }
  .photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 55%;
    display:block;
  }

  /* 3. CANDIDATES */
  .cands{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    column-gap:calc(26px * var(--s));
    align-items:start;
  }
  .cand{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:calc(9px * var(--s));
  }
  .cand .bar{
    width:calc(54px * var(--s));
    height:calc(5px * var(--s));
    background:var(--red);
    border-radius:calc(3px * var(--s));
  }
  .cand .nm{
    font-size:calc(35px * var(--s));
    line-height:1.15;
    font-weight:800;
    color:var(--navy);
    letter-spacing:-0.015em;
    white-space:nowrap;
  }
  .cand .ro{
    font-size:calc(23px * var(--s));
    line-height:1.2;
    font-weight:600;
    color:#5A6480;
    letter-spacing:0.01em;
    white-space:nowrap;
  }

  /* 4. CTA BAR */
  .cta{
    flex:0 0 auto;
    width:100%;
    background:var(--red);
    min-height:calc(112px * var(--s));
    display:flex;
    align-items:center;
    justify-content:center;
    gap:calc(26px * var(--s));
    padding:calc(18px * var(--s)) calc(20px * var(--s));
  }
  .cta img{
    width:calc(56px * var(--s));
    height:calc(44px * var(--s));
    display:block;
    flex:0 0 auto;
  }
  .cta span{
    font-size:calc(46px * var(--s));
    line-height:1;
    font-weight:900;
    color:#fff;
    letter-spacing:calc(0.055em);
    white-space:nowrap;
  }

  /* 5. STEPS */
  .steps{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:calc(22px * var(--s));
  }
  .step{
    display:flex;
    align-items:center;
    gap:calc(20px * var(--s));
  }
  .step img{
    width:calc(40px * var(--s));
    height:calc(40px * var(--s));
    display:block;
    flex:0 0 auto;
  }
  .step span{
    font-size:calc(28px * var(--s));
    line-height:1.25;
    font-weight:600;
    color:var(--navy);
    letter-spacing:-0.005em;
  }
  /* wide variant: steps sit in one evenly spaced row */
  #flyer.rowsteps .steps{
    flex-direction:row;
    gap:calc(26px * var(--s));
  }
  #flyer.rowsteps .step{
    flex:1 1 0;
    min-width:0;
    align-items:flex-start;
  }
  #flyer.rowsteps .step img{margin-top:calc(2px * var(--s))}

  /* 6. FOOTER */
  footer{
    flex:0 0 auto;
    font-size:calc(22px * var(--s));
    line-height:1.3;
    font-weight:500;
    color:#6B7488;
    letter-spacing:0.005em;
  }
</style>
</head>
<body>
<div id="flyer">

  <h1 class="pad">Proven <span class="r">RESULTS</span> for <span class="r">WILLOWMERE</span> Families</h1>

  <div class="photo"><img src="photo.png" alt=""></div>

  <div class="cands pad">
    <div class="cand"><div class="bar"></div><div class="nm">Dana Levi</div><div class="ro">Mayor</div></div>
    <div class="cand"><div class="bar"></div><div class="nm">Omar Haddad</div><div class="ro">Council</div></div>
    <div class="cand"><div class="bar"></div><div class="nm">Ruth Cohen</div><div class="ro">Council</div></div>
  </div>

  <div class="cta">
    <img src="mail.svg" alt="">
    <span>VOTE BY MAIL</span>
  </div>

  <div class="steps pad">
    <div class="step"><img src="check.svg" alt=""><span>Request your ballot by October&nbsp;20</span></div>
    <div class="step"><img src="check.svg" alt=""><span>Fill it out at home</span></div>
    <div class="step"><img src="check.svg" alt=""><span>Mail it back by November&nbsp;3</span></div>
  </div>

  <footer class="pad">Paid for by Willowmere Forward · willowmereforward.org</footer>

</div>
<script>
  const q = new URLSearchParams(location.search);
  const w = +(q.get('w') || 1080);
  const h = +(q.get('h') || 1350);
  const s = +(q.get('s') || 1);
  const r = document.documentElement.style;
  r.setProperty('--w', w + 'px');
  r.setProperty('--h', h + 'px');
  r.setProperty('--s', s);
  r.setProperty('--pm', (q.get('pm') || (w * 0.55)) + 'px');
  if (q.get('steps') === 'row') document.getElementById('flyer').classList.add('rowsteps');
</script>
</body>
</html>
