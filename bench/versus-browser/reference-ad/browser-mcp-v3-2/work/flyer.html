<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vote By Mail Flyer</title>
<style>
@font-face{
  font-family:'Inter';
  src:url('Inter.ttf') format('truetype');
  font-weight:100 900;
  font-style:normal;
  font-display:block;
}
:root{
  --s:1;              /* content scale */
  --navy:#1B2A5C;
  --red:#D0202E;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#555;}
body{display:block;}

#stage{
  position:relative;
  overflow:hidden;
  background:#fff;
  font-family:'Inter',sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:stretch;
  padding:calc(var(--s) * 54px) 0 calc(var(--s) * 44px);
}
#stage > *{flex:0 0 auto;}
#stage > .photoband{flex:3 3 calc(var(--s) * 420px);}
/* flexible spacers: share leftover room with the photo band */
#stage > .sp{
  flex:1 1 calc(var(--s) * 34px);
  min-height:calc(var(--s) * 22px);
}

.pad{padding-left:calc(var(--s) * 56px);padding-right:calc(var(--s) * 56px);}

/* 1. Headline */
.headline{
  font-size:calc(var(--s) * 64px);
  line-height:1.1;
  font-weight:800;
  letter-spacing:calc(var(--s) * -1.1px);
  color:var(--navy);
  text-align:center;
  text-wrap:balance;
}
.headline em{font-style:normal;color:var(--red);}

/* 2. Photo band */
.photoband{
  width:100%;
  min-height:calc(var(--s) * 150px);
  max-height:calc(var(--s) * 760px);
  overflow:hidden;
  background:#1B2A5C;
}
.photoband img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 52%;
}

/* 3. Candidates */
.cands{
  display:flex;
  flex-direction:row;
  align-items:stretch;
  justify-content:space-between;
  gap:calc(var(--s) * 24px);
}
.cand{
  flex:1 1 0;
  min-width:0;
  background:#F1F4FB;
  border-top:calc(var(--s) * 5px) solid var(--red);
  border-radius:0 0 calc(var(--s) * 8px) calc(var(--s) * 8px);
  padding:calc(var(--s) * 20px) calc(var(--s) * 8px) calc(var(--s) * 18px);
  text-align:center;
}
.cand .nm{
  font-size:calc(var(--s) * 33px);
  line-height:1.15;
  font-weight:700;
  color:var(--navy);
  letter-spacing:calc(var(--s) * -0.4px);
  white-space:nowrap;
}
.cand .rl{
  margin-top:calc(var(--s) * 7px);
  font-size:calc(var(--s) * 22px);
  line-height:1.2;
  font-weight:600;
  color:var(--red);
  text-transform:uppercase;
  letter-spacing:calc(var(--s) * 1.2px);
  white-space:nowrap;
}

/* 4. CTA bar */
.cta{
  width:100%;
  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(var(--s) * 24px);
  padding:calc(var(--s) * 28px) calc(var(--s) * 20px);
}
.cta img{
  display:block;
  width:calc(var(--s) * 56px);
  height:calc(var(--s) * 44px);
  flex:0 0 auto;
}
.cta span{
  font-size:calc(var(--s) * 46px);
  line-height:1;
  font-weight:800;
  color:#fff;
  letter-spacing:calc(var(--s) * 2.4px);
  white-space:nowrap;
}

/* 5. Steps */
.steps{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:calc(var(--s) * 20px);
}
.steps ul{list-style:none;display:flex;flex-direction:column;gap:calc(var(--s) * 20px);}
.step{
  display:flex;
  align-items:center;
  gap:calc(var(--s) * 18px);
}
.step img{
  display:block;
  width:calc(var(--s) * 40px);
  height:calc(var(--s) * 40px);
  flex:0 0 auto;
}
.step span{
  font-size:calc(var(--s) * 29px);
  line-height:1.25;
  font-weight:600;
  color:var(--navy);
  white-space:nowrap;
}

/* 6. Footer */
.footer{
  text-align:center;
  font-size:calc(var(--s) * 20px);
  line-height:1.3;
  font-weight:500;
  color:#67708C;
  letter-spacing:calc(var(--s) * 0.2px);
  white-space:nowrap;
}
</style>
</head>
<body>
<div id="stage">

  <h1 class="headline pad">Proven <em>RESULTS</em> for<br><em>WILLOWMERE</em> Families</h1>

  <div class="sp"></div>

  <div class="photoband">
    <img src="photo.jpg" alt="Farmhouse in a field at sunrise">
  </div>

  <div class="sp"></div>

  <div class="cands pad">
    <div class="cand"><div class="nm">Dana Levi</div><div class="rl">Mayor</div></div>
    <div class="cand"><div class="nm">Omar Haddad</div><div class="rl">Council</div></div>
    <div class="cand"><div class="nm">Ruth Cohen</div><div class="rl">Council</div></div>
  </div>

  <div class="sp"></div>

  <div class="cta">
    <img src="mail.svg" alt="">
    <span>VOTE BY MAIL</span>
  </div>

  <div class="sp"></div>

  <div class="steps pad">
    <ul>
      <li class="step"><img src="check.svg" alt=""><span>Request your ballot by October 20</span></li>
      <li class="step"><img src="check.svg" alt=""><span>Fill it out at home</span></li>
      <li class="step"><img src="check.svg" alt=""><span>Mail it back by November 3</span></li>
    </ul>
  </div>

  <div class="sp"></div>

  <div class="footer pad">Paid for by Willowmere Forward · willowmereforward.org</div>

</div>

<script>
(function(){
  var p = new URLSearchParams(location.search);
  var w = +p.get('w') || 1080, h = +p.get('h') || 1350, s = +p.get('s') || 1;
  var st = document.getElementById('stage');
  st.style.width = w + 'px';
  st.style.height = h + 'px';
  st.style.setProperty('--s', s);
  document.documentElement.style.setProperty('--s', s);
})();
</script>
</body>
</html>
