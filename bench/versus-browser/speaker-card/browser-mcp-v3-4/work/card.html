<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaker card</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('Inter.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #0F1226;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: #FFFFFF;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }

  .card {
    position: relative;
    overflow: hidden;
    background: #0F1226;
    display: flex;
    flex-direction: column;
  }

  /* Decorative accents */
  /* Decoration must stay BEHIND the content: an absolutely positioned
     element otherwise paints on top of static content (it was tinting
     the portrait violet in the landscape layout). */
  .glow {
    position: absolute;
    z-index: 0;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(124,92,255,0.40) 0%, rgba(124,92,255,0.14) 42%, rgba(124,92,255,0) 70%);
  }
  .brand, .cols, .left, .right, .speaker, .footer, .eyebrow, .title {
    position: relative;
    z-index: 1;
  }
  .hairline {
    position: absolute;
    z-index: 2;
    background: linear-gradient(90deg, #7C5CFF 0%, rgba(124,92,255,0) 100%);
    height: 4px;
    left: 0; top: 0; right: 0;
  }

  /* ---------- shared pieces ---------- */
  .brand {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .brand img { display: block; }
  .brand .rule {
    background: rgba(255,255,255,0.22);
    flex-shrink: 0;
  }
  .brand .ename {
    font-weight: 700;
    white-space: nowrap;
    color: #FFFFFF;
  }

  /* .left is the text column in every variant; it must be a column
     flex container so the auto margins that distribute slack work. */
  .left {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1 1 auto;
  }

  .speaker {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .avatar {
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    aspect-ratio: 1 / 1;
    background: #1A1F3D;
    box-shadow: 0 0 0 var(--ringw, 6px) rgba(124,92,255,0.95),
                0 0 0 calc(var(--ringw, 6px) + 10px) rgba(124,92,255,0.18);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }
  .sname {
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .srole {
    font-weight: 500;
    color: rgba(255,255,255,0.68);
    white-space: nowrap;
  }

  .eyebrow {
    font-weight: 700;
    color: #7C5CFF;
    text-transform: uppercase;
  }

  .title {
    font-weight: 700;
    letter-spacing: -0.025em;
    text-wrap: pretty;
    padding-bottom: 0.1em; /* room for descenders at tight line-height */
  }
  .title .hl { color: #7C5CFF; }
  /* keep hyphenated compounds together so they don't break as "on-" / "call" */
  .nb { white-space: nowrap; }

  .meta {
    font-weight: 500;
    color: rgba(255,255,255,0.78);
    white-space: nowrap;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #7C5CFF;
    color: #FFFFFF;
    font-weight: 700;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    border-top: 2px solid rgba(255,255,255,0.12);
  }

  /* =======================================================
     SQUARE 1080 x 1080
     ======================================================= */
  body.square .card {
    width: 1080px; height: 1080px;
    padding: 70px 72px 64px;
  }
  body.square .glow { width: 760px; height: 760px; right: -280px; top: -300px; }
  body.square .brand { gap: 22px; }
  body.square .brand img { width: 160px; height: 48px; }
  body.square .brand .rule { width: 2px; height: 34px; }
  body.square .brand .ename { font-size: 25px; letter-spacing: 0.16em; }

  /* .left fills the leftover height so the auto margins below can
     share the slack evenly instead of pooling above the footer */
  body.square .left { flex: 1 1 auto; min-height: 0; }
  body.square .speaker { gap: 32px; margin-top: auto; }
  body.square .avatar { width: 200px; height: 200px; --ringw: 6px; }
  body.square .sname { font-size: 43px; }
  body.square .srole { font-size: 25px; margin-top: 8px; }

  body.square .eyebrow { font-size: 19px; letter-spacing: 0.2em; margin-top: auto; }
  body.square .title { font-size: 66px; line-height: 1.1; margin-top: 22px; margin-bottom: auto; }

  body.square .footer { margin-top: auto; padding-top: 38px; }
  body.square .meta { font-size: 25px; }
  body.square .cta { font-size: 25px; padding: 0 44px; height: 72px; }

  /* =======================================================
     LANDSCAPE 1920 x 1080
     ======================================================= */
  body.landscape .card {
    width: 1920px; height: 1080px;
    padding: 72px 88px 68px;
  }
  body.landscape .glow { width: 900px; height: 900px; right: -230px; top: -220px; }

  body.landscape .cols {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    align-items: center;
    gap: 96px;
    padding: 28px 0 20px;
  }
  body.landscape .left {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  body.landscape .right {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  body.landscape .brand { gap: 24px; }
  body.landscape .brand img { width: 180px; height: 54px; }
  body.landscape .brand .rule { width: 2px; height: 38px; }
  body.landscape .brand .ename { font-size: 27px; letter-spacing: 0.17em; }

  body.landscape .avatar { width: 440px; height: 440px; --ringw: 8px; }
  body.landscape .right .sname { font-size: 42px; margin-top: 10px; text-align: center; }
  body.landscape .right .srole { font-size: 24px; text-align: center; }

  body.landscape .eyebrow { font-size: 20px; letter-spacing: 0.2em; }
  body.landscape .title { font-size: 80px; line-height: 1.08; margin-top: 24px; }

  body.landscape .footer { margin-top: auto; padding-top: 40px; }
  body.landscape .meta { font-size: 27px; }
  body.landscape .cta { font-size: 26px; padding: 0 50px; height: 78px; }

  /* =======================================================
     STORY 1080 x 1920
     ======================================================= */
  body.story .card {
    width: 1080px; height: 1920px;
    padding: 110px 80px 110px;
  }
  body.story .glow { width: 900px; height: 900px; right: -300px; top: -320px; }
  body.story .glow.b { width: 760px; height: 760px; left: -340px; right: auto; top: auto; bottom: -300px; }

  body.story .brand { gap: 22px; }
  body.story .brand img { width: 170px; height: 51px; }
  body.story .brand .rule { width: 2px; height: 36px; }
  body.story .brand .ename { font-size: 26px; letter-spacing: 0.16em; }

  /* auto margins share the leftover height instead of pooling it
     above the footer */
  body.story .speaker {
    flex-direction: column;
    align-items: flex-start;
    gap: 38px;
    margin-top: auto;
  }
  body.story .avatar { width: 380px; height: 380px; --ringw: 8px; }
  body.story .sname { font-size: 52px; }
  body.story .srole { font-size: 29px; margin-top: 10px; }

  body.story .eyebrow { font-size: 21px; letter-spacing: 0.2em; margin-top: auto; }
  body.story .title { font-size: 76px; line-height: 1.1; margin-top: 26px; margin-bottom: auto; }

  body.story .footer {
    margin-top: auto;
    padding-top: 48px;
    flex-direction: column;
    align-items: flex-start;
    gap: 36px;
  }
  body.story .meta { font-size: 29px; }
  body.story .cta { font-size: 29px; padding: 0 56px; height: 86px; align-self: stretch; }
</style>
</head>
<body class="square">
  <div class="card" id="card">
    <div class="glow"></div>
    <div class="glow b"></div>
    <div class="hairline"></div>

    <!-- 1. logo + event name -->
    <div class="brand">
      <img src="logo.svg" alt="">
      <div class="rule"></div>
      <div class="ename">FIELDNOTES CONF 2026</div>
    </div>

    <div class="cols">
      <div class="left">
        <!-- 2+3. portrait, name, role (square/story) -->
        <div class="speaker" id="speakerBlock">
          <div class="avatar"><img src="portrait.png" alt="Maya Okonkwo-Lindqvist"></div>
          <div class="who">
            <div class="sname">Maya Okonkwo-Lindqvist</div>
            <div class="srole">Principal Engineer, Northwind Labs</div>
          </div>
        </div>

        <!-- 4. talk title -->
        <div class="eyebrow">Keynote</div>
        <h1 class="title">Shipping at the speed of trust: <span class="hl">what ten years of <span class="nb">on-call</span></span> taught us about resilient systems</h1>
      </div>

      <div class="right" id="rightCol"></div>
    </div>

    <!-- 5 + 6 -->
    <div class="footer">
      <div class="meta">November 14, 2026 · Harbor Hall, Lisbon</div>
      <div class="cta">Get tickets</div>
    </div>
  </div>

<script src="audit.js"></script>
<script>
  // Variant from ?v=
  var v = (new URLSearchParams(location.search).get('v') || 'square');
  document.body.className = v;

  // For landscape, move the portrait + name into the right column (stacked)
  if (v === 'landscape') {
    var sp = document.getElementById('speakerBlock');
    var right = document.getElementById('rightCol');
    var avatar = sp.querySelector('.avatar');
    var who = sp.querySelector('.who');
    right.appendChild(avatar);
    var nm = who.querySelector('.sname'), rl = who.querySelector('.srole');
    var box = document.createElement('div');
    box.appendChild(nm); box.appendChild(rl);
    box.style.textAlign = 'center';
    right.appendChild(box);
    sp.remove();
  } else {
    // square/story: cols wrapper should not impose flex layout
    var cols = document.querySelector('.cols');
    cols.style.display = 'contents';
  }

  // Signal fonts/images ready
  window.__ready = false;
  Promise.all([
    document.fonts.ready,
    ...Array.from(document.images).map(function (im) {
      return im.complete ? Promise.resolve() : new Promise(function (r) { im.onload = im.onerror = r; });
    })
  ]).then(function () {
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ window.__ready = true; }); });
  });
</script>
</body>
</html>
