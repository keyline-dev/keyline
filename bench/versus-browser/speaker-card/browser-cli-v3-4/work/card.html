<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaker card</title>
<style>
@font-face{
  font-family:"Inter";
  src:url("Inter.ttf") format("truetype");
  font-weight:100 900;
  font-style:normal;
  font-display:block;
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;
  background:#0F1226;
  font-family:"Inter",sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

:root{
  --bg:#0F1226;
  --accent:#7C5CFF;
  --muted:#A7ADD2;
  --line:rgba(255,255,255,.14);
}

.card{
  position:relative;
  width:100vw;height:100vh;
  overflow:hidden;
  background:
    radial-gradient(900px 620px at 88% -10%, rgba(124,92,255,.30), transparent 62%),
    radial-gradient(760px 560px at -12% 108%, rgba(124,92,255,.20), transparent 60%),
    var(--bg);
  display:flex;flex-direction:column;
  color:#fff;
}
/* soft accent hairline at the very top */
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:5px;
  background:linear-gradient(90deg,var(--accent),rgba(124,92,255,0) 72%);
}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:22px;flex:none}
.brand .logo{display:block;height:44px;width:auto}
.brand .rule{width:1px;height:34px;background:var(--line);flex:none}
.brand .event{
  font-weight:700;font-size:22px;letter-spacing:.17em;
  white-space:nowrap;color:#fff;
}

/* ---------- stage ---------- */
.stage{flex:1;display:grid;min-height:0;align-content:center}

.shot{
  grid-area:shot;position:relative;flex:none;border-radius:50%;
  background:var(--bg);
  box-shadow:0 0 0 4px var(--accent), 0 0 0 11px rgba(124,92,255,.17),
             0 26px 60px rgba(0,0,0,.45);
}
.shot img{
  display:block;width:100%;height:100%;
  border-radius:50%;object-fit:cover;object-position:50% 42%;
}
.who{grid-area:who;min-width:0}
.name{font-weight:700;letter-spacing:-.015em;line-height:1.08}
.role{color:var(--muted);font-weight:500;line-height:1.3}

.title{grid-area:title;
  font-weight:700;letter-spacing:-.022em;line-height:1.1;
  text-wrap:balance;hyphens:none;
}
.title em{font-style:normal;color:var(--accent)}

/* ---------- footer ---------- */
.meta{display:flex;align-items:center;flex:none}
.when{color:var(--muted);font-weight:500;white-space:nowrap}
.cta{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  background:var(--accent);color:#fff;font-weight:700;
  border-radius:999px;white-space:nowrap;
  box-shadow:0 14px 34px rgba(124,92,255,.38);
}

/* =======================================================
   SQUARE 1080 x 1080  (default)
   ======================================================= */
.card{padding:74px}
.stage{
  grid-template-columns:auto 1fr;
  grid-template-areas:"shot who" "title title";
  column-gap:32px;row-gap:54px;
}
.shot{width:180px;height:180px;align-self:center}
.who{align-self:center}
.name{font-size:39px}
.role{font-size:23px;margin-top:9px}
.title{font-size:61px}
.meta{justify-content:space-between;gap:36px;padding-top:34px;border-top:1px solid var(--line)}
.when{font-size:23px}
.cta{font-size:23px;padding:20px 42px}

/* =======================================================
   LANDSCAPE 1920 x 1080
   ======================================================= */
@media (min-width:1900px){
  .card{padding:78px 104px}
  .brand .logo{height:50px}
  .brand .event{font-size:25px}

  .stage{
    grid-template-columns:minmax(0,1fr) 380px;
    grid-template-areas:"who shot" "title shot";
    column-gap:96px;row-gap:44px;padding:40px 0 30px;
  }
  .shot{width:380px;height:380px;align-self:center;justify-self:center}
  .title{font-size:70px}
  .name{font-size:42px}
  .role{font-size:25px;margin-top:11px}

  .meta{justify-content:space-between;gap:48px;padding-top:38px}
  .when{font-size:25px}
  .cta{font-size:25px;padding:23px 50px}
}

/* =======================================================
   STORY 1080 x 1920
   ======================================================= */
@media (max-width:1100px) and (min-height:1800px){
  .card{padding:116px 84px 110px}
  .brand{justify-content:center}
  .brand .logo{height:48px}
  .brand .event{font-size:24px}

  .stage{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"shot" "who" "title";
    justify-items:center;text-align:center;row-gap:50px;
  }
  .shot{width:444px;height:444px}
  .title{margin-top:26px;font-size:68px}
  .name{font-size:55px}
  .role{font-size:30px;margin-top:16px}

  .meta{flex-direction:column;gap:42px;padding-top:56px}
  .when{font-size:27px}
  .cta{font-size:27px;padding:26px 56px}
}
</style>
</head>
<body>
  <div class="card">

    <header class="brand">
      <img class="logo" src="logo.svg" alt="Fieldnotes Conf logo">
      <span class="rule"></span>
      <span class="event">FIELDNOTES CONF 2026</span>
    </header>

    <main class="stage">
      <div class="shot"><img src="portrait.png" alt="Maya Okonkwo-Lindqvist"></div>

      <div class="who">
        <h2 class="name">Maya Okonkwo-Lindqvist</h2>
        <p class="role">Principal Engineer, Northwind Labs</p>
      </div>

      <h1 class="title">Shipping at the speed of <em>trust</em>: what ten years of on-call taught us about resilient systems</h1>
    </main>

    <footer class="meta">
      <p class="when">November 14, 2026 · Harbor Hall, Lisbon</p>
      <span class="cta">Get tickets</span>
    </footer>

  </div>
</body>
</html>
