<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Speaker card</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('Inter.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }

  :root {
    --bg: #0F1226;
    --accent: #7C5CFF;
    --muted: rgba(255,255,255,0.62);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #000;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #card {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    color: #fff;
    display: flex;
    flex-direction: column;
  }

  /* decorative glow */
  #card::before {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,92,255,0.34) 0%, rgba(124,92,255,0.10) 45%, rgba(124,92,255,0) 70%);
    pointer-events: none;
  }
  #card::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--accent) 0%, #B49CFF 50%, rgba(124,92,255,0) 100%);
  }

  .inner {
    position: relative;
    z-index: 2;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: var(--hdr-gap);
    flex: 0 0 auto;
  }
  header img { display: block; width: var(--logo-w); height: auto; }
  .rule {
    width: 2px;
    height: var(--rule-h);
    background: rgba(255,255,255,0.22);
    flex: 0 0 auto;
  }
  .event {
    font-size: var(--event-fs);
    font-weight: 700;
    letter-spacing: 0.17em;
    line-height: 1;
    white-space: nowrap;
  }

  /* ---------- speaker ---------- */
  .speaker {
    display: flex;
    align-items: center;
    gap: var(--sp-gap);
    flex: 0 0 auto;
  }
  .avatar {
    flex: 0 0 auto;
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
    overflow: hidden;
    background: #1b1f3d;
    box-shadow: 0 0 0 var(--ring) rgba(124,92,255,0.95),
                0 0 0 calc(var(--ring) + 2px) rgba(255,255,255,0.10);
  }
  .avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;
  }
  .who { min-width: 0; }
  .name {
    font-size: var(--name-fs);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.015em;
  }
  .role {
    margin-top: var(--role-mt);
    font-size: var(--role-fs);
    font-weight: 500;
    line-height: 1.3;
    color: var(--muted);
  }

  /* ---------- title ---------- */
  .title-wrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }
  h1 {
    font-size: var(--title-fs);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1 .hl { color: var(--accent); }

  /* ---------- footer ---------- */
  footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--foot-gap);
  }
  .meta {
    font-size: var(--meta-fs);
    font-weight: 500;
    line-height: 1.35;
    color: var(--muted);
  }
  .meta b { color: #fff; font-weight: 700; }
  .btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    font-size: var(--btn-fs);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    padding: var(--btn-py) var(--btn-px);
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 10px 40px rgba(124,92,255,0.40);
  }

  /* =======================================================
     SQUARE 1080 x 1080
     ======================================================= */
  body.square #card {
    width: 1080px; height: 1080px;
    --logo-w: 160px; --hdr-gap: 24px; --rule-h: 38px; --event-fs: 23px;
    --avatar: 180px; --ring: 5px; --sp-gap: 34px;
    --name-fs: 44px; --role-fs: 23px; --role-mt: 8px;
    --title-fs: 70px;
    --meta-fs: 24px; --btn-fs: 23px; --btn-py: 22px; --btn-px: 44px; --foot-gap: 40px;
  }
  body.square .inner { padding: 76px; gap: 46px; }
  body.square #card::before { width: 900px; height: 900px; right: -320px; top: -300px; }

  /* =======================================================
     LANDSCAPE 1920 x 1080
     ======================================================= */
  body.landscape #card {
    width: 1920px; height: 1080px;
    --logo-w: 176px; --hdr-gap: 26px; --rule-h: 42px; --event-fs: 25px;
    --avatar: 400px; --ring: 6px; --sp-gap: 34px;
    --name-fs: 42px; --role-fs: 24px; --role-mt: 10px;
    --title-fs: 78px;
    --meta-fs: 26px; --btn-fs: 25px; --btn-py: 24px; --btn-px: 50px; --foot-gap: 48px;
  }
  body.landscape .inner { padding: 78px 92px; gap: 44px; }
  body.landscape #card::before { width: 1100px; height: 1100px; right: -380px; top: -340px; }

  body.landscape .body-row {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 84px;
    min-height: 0;
  }
  body.landscape .col-left {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 40px;
    min-width: 0;
    min-height: 0;
  }
  body.landscape .col-right {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 30px;
    width: 560px;
  }
  body.landscape .col-right .name { white-space: nowrap; }
  body.landscape .col-right .speaker {
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  body.landscape .col-right .who { text-align: center; }
  body.landscape .title-wrap { flex: 0 0 auto; }

  /* =======================================================
     STORY 1080 x 1920
     ======================================================= */
  body.story #card {
    width: 1080px; height: 1920px;
    --logo-w: 168px; --hdr-gap: 24px; --rule-h: 40px; --event-fs: 24px;
    --avatar: 460px; --ring: 7px; --sp-gap: 36px;
    --name-fs: 54px; --role-fs: 29px; --role-mt: 14px;
    --title-fs: 84px;
    --meta-fs: 30px; --btn-fs: 30px; --btn-py: 30px; --btn-px: 62px; --foot-gap: 40px;
  }
  body.story .inner { padding: 96px 80px 110px; gap: 64px; }
  body.story #card::before { width: 1150px; height: 1150px; right: -400px; top: -300px; }
  body.story header { justify-content: center; }
  body.story .speaker {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 34px;
  }
  body.story h1 { text-align: center; }
  body.story .title-wrap { justify-content: center; }
  body.story footer {
    flex-direction: column;
    gap: 44px;
    text-align: center;
  }
  body.story .meta { font-size: var(--meta-fs); }
</style>
</head>
<body>
<div id="card">
  <div class="inner">
    <header>
      <img src="logo.svg" alt="" />
      <div class="rule"></div>
      <div class="event">FIELDNOTES CONF 2026</div>
    </header>

    <div class="body-row">
      <div class="col-left">
        <div class="title-wrap">
          <h1>Shipping at the speed of trust: <span class="hl">what ten years of on-call taught us about resilient systems</span></h1>
        </div>
      </div>
      <div class="col-right">
        <div class="speaker">
          <div class="avatar"><img src="portrait.png" alt="Maya Okonkwo-Lindqvist" /></div>
          <div class="who">
            <div class="name">Maya Okonkwo-Lindqvist</div>
            <div class="role">Principal Engineer, Northwind Labs</div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="meta"><b>November 14, 2026</b> · Harbor Hall, Lisbon</div>
      <div class="btn">Get tickets</div>
    </footer>
  </div>
</div>

<script>
  const variant = new URLSearchParams(location.search).get('v') || 'square';
  document.body.className = variant;

  // For square & story, flatten the body-row wrapper so it's a plain vertical stack.
  if (variant !== 'landscape') {
    const row = document.querySelector('.body-row');
    const inner = document.querySelector('.inner');
    const speaker = document.querySelector('.col-right .speaker');
    const titleWrap = document.querySelector('.title-wrap');
    inner.insertBefore(speaker, row);
    inner.insertBefore(titleWrap, row);
    row.remove();
  }

  // Fit: shrink the title until nothing overflows the card.
  function overflowReport() {
    const card = document.getElementById('card');
    const cr = card.getBoundingClientRect();
    const bad = [];
    card.querySelectorAll('*').forEach(el => {
      if (!el.getClientRects().length) return;
      const b = el.getBoundingClientRect();
      if (getComputedStyle(el).position === 'absolute') return;
      if (b.left < cr.left - 0.5 || b.right > cr.right + 0.5 ||
          b.top < cr.top - 0.5 || b.bottom > cr.bottom + 0.5) {
        bad.push([el.className || el.tagName, Math.round(b.left), Math.round(b.top), Math.round(b.right), Math.round(b.bottom)]);
      }
      if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflow !== 'hidden' && el.children.length === 0) {
        bad.push(['scrollW:' + (el.className || el.tagName), el.scrollWidth, el.clientWidth]);
      }
    });
    return bad;
  }

  function fit() {
    const inner = document.querySelector('.inner');
    const h1 = document.querySelector('h1');
    h1.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(h1).fontSize);
    const overflow = () => inner.scrollHeight > inner.clientHeight + 0.5 ||
                           inner.scrollWidth  > inner.clientWidth + 0.5 ||
                           overflowReport().length > 0;
    let guard = 0;
    while (overflow() && fs > 18 && guard++ < 400) {
      fs -= 1;
      h1.style.fontSize = fs + 'px';
    }
    return { fs, bad: overflowReport() };
  }
  window.overflowReport = overflowReport;

  window.fitResult = null;
  document.fonts.ready.then(() => {
    window.fitResult = fit();
    document.documentElement.setAttribute('data-ready', '1');
  });
</script>
</body>
</html>
