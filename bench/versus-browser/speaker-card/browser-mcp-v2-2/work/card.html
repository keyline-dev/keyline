<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaker Card</title>
<style>
@font-face {
  font-family: 'Inter';
  src: url('Inter.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}

:root{
  --bg:#0F1226;
  --accent:#7C5CFF;
  --ink:#FFFFFF;
  --muted:rgba(255,255,255,.66);
}

*{box-sizing:border-box;margin:0;padding:0;}
a{text-decoration:none;color:inherit;}
html,body{background:#000;}
body{
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-feature-settings:"kern" 1,"liga" 1;
}

.card{
  position:relative;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  flex-direction:column;
}

/* decorative glows */
.card::before,.card::after{
  content:'';
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.card::before{
  width:68%;aspect-ratio:1;
  right:-22%;top:-26%;
  background:radial-gradient(circle,rgba(124,92,255,.38) 0%,rgba(124,92,255,0) 68%);
}
.card::after{
  width:60%;aspect-ratio:1;
  left:-24%;bottom:-28%;
  background:radial-gradient(circle,rgba(124,92,255,.22) 0%,rgba(124,92,255,0) 70%);
}

.edge{
  position:absolute;
  left:0;right:0;bottom:0;
  height:12px;
  z-index:2;
  background:linear-gradient(90deg,#7C5CFF 0%,#A48BFF 45%,#FFFFFF 100%);
}

.inner{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  width:100%;
  height:100%;
}
.vertical-only{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}

/* ---------- brand ---------- */
.brand{
  display:flex;
  align-items:center;
  gap:var(--brand-gap);
  flex:none;
}
.brand img{
  height:var(--logo-h);
  width:auto;
  display:block;
}
.brand .rule{
  width:2px;
  height:calc(var(--logo-h) * .72);
  background:rgba(255,255,255,.26);
  flex:none;
}
.brand .evt{
  font-size:var(--evt-fs);
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  white-space:nowrap;
  line-height:1;
}

/* ---------- speaker ---------- */
.avatar{
  width:var(--avatar);
  height:var(--avatar);
  flex:none;
  border-radius:50%;
  overflow:hidden;
  background:#1b1f3d;
  box-shadow:0 0 0 var(--ring) rgba(124,92,255,.95),
             0 0 0 calc(var(--ring) + 2px) rgba(255,255,255,.10);
}
.avatar img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}

.who .name{
  font-size:var(--name-fs);
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.015em;
}
.who .role{
  margin-top:var(--role-mt);
  font-size:var(--role-fs);
  font-weight:500;
  line-height:1.25;
  color:var(--accent);
}

/* ---------- title ---------- */
.title{
  font-size:var(--title-fs);
  font-weight:700;
  line-height:1.12;
  letter-spacing:-.022em;
  text-wrap:balance;
}

/* ---------- meta + cta ---------- */
.meta{
  font-size:var(--meta-fs);
  font-weight:500;
  color:var(--muted);
  line-height:1.3;
}
.cta{
  align-self:flex-start;
  display:inline-flex;
  align-items:center;
  gap:.6em;
  background:var(--accent);
  color:#fff;
  font-size:var(--cta-fs);
  font-weight:700;
  letter-spacing:.005em;
  line-height:1;
  padding:var(--cta-py) var(--cta-px);
  border-radius:999px;
  white-space:nowrap;
  box-shadow:0 calc(var(--cta-py)*.35) calc(var(--cta-py)*1.2) rgba(124,92,255,.35);
}
.cta .arrow{
  font-size:.92em;
  transform:translateY(.02em);
}

/* =======================================================
   SQUARE 1080 x 1080
   ======================================================= */
body.square .card{
  width:1080px;height:1080px;
  --logo-h:46px; --evt-fs:23px; --brand-gap:22px;
  --avatar:200px; --ring:5px;
  --name-fs:48px; --role-fs:26px; --role-mt:8px;
  --title-fs:72px;
  --meta-fs:26px;
  --cta-fs:26px; --cta-px:42px; --cta-py:24px;
}
body.square .inner{padding:76px 78px 72px;}
body.square .speaker{
  display:flex;align-items:center;gap:34px;
  margin-top:66px;
}
body.square .title{margin-top:62px;}
body.square .foot{
  margin-top:auto;
  padding-top:44px;
  border-top:1px solid rgba(255,255,255,.14);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:36px;
}

/* =======================================================
   LANDSCAPE 1920 x 1080
   ======================================================= */
body.landscape .card{
  width:1920px;height:1080px;
  --logo-h:48px; --evt-fs:24px; --brand-gap:24px;
  --avatar:460px; --ring:7px;
  --name-fs:44px; --role-fs:24px; --role-mt:10px;
  --title-fs:72px;
  --meta-fs:27px;
  --cta-fs:27px; --cta-px:46px; --cta-py:26px;
}
body.landscape .inner{padding:72px 90px 74px;}
body.landscape .body{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  gap:100px;
  margin-top:28px;
}
body.landscape .col-left{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
}
body.landscape .col-left .title{max-width:1040px;}
body.landscape .col-left .meta{margin-top:44px;}
body.landscape .col-left .cta{margin-top:46px;}
body.landscape .col-right{
  flex:none;
  width:560px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
body.landscape .col-right .who{margin-top:40px;}
body.landscape .col-right .name{white-space:nowrap;}

/* =======================================================
   STORY 1080 x 1920
   ======================================================= */
body.story .card{
  width:1080px;height:1920px;
  --logo-h:52px; --evt-fs:26px; --brand-gap:26px;
  --avatar:450px; --ring:8px;
  --name-fs:60px; --role-fs:31px; --role-mt:14px;
  --title-fs:74px;
  --meta-fs:30px;
  --cta-fs:31px; --cta-px:52px; --cta-py:29px;
}
body.story .inner{padding:120px 88px 130px;}
body.story .brand{justify-content:center;}
body.story .speaker{
  margin-top:128px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
body.story .speaker .who{margin-top:44px;}
body.story .title{margin-top:104px;text-align:center;}
body.story .vertical-only{justify-content:center;}
body.story .foot{
  margin-top:0;
  padding-top:104px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:52px;
  text-align:center;
}
body.story .cta{align-self:center;}
</style>
</head>
<body>
<div class="card">
  <div class="edge"></div>
  <div class="inner">

    <!-- ======= header ======= -->
    <header class="brand">
      <img src="logo.svg" alt="Fieldnotes Conf logo">
      <span class="rule"></span>
      <span class="evt">Fieldnotes Conf 2026</span>
    </header>

    <!-- ======= square / story body ======= -->
    <div class="vertical-only">
      <div class="speaker">
        <div class="avatar"><img src="portrait.png" alt="Maya Okonkwo-Lindqvist"></div>
        <div class="who">
          <div class="name">Maya&nbsp;Okonkwo-Lindqvist</div>
          <div class="role">Principal Engineer, Northwind&nbsp;Labs</div>
        </div>
      </div>

      <h1 class="title">Shipping at the speed of trust: what ten years of on-call taught us about resilient systems</h1>

      <div class="foot">
        <div class="meta">November 14, 2026 · Harbor Hall, Lisbon</div>
        <a class="cta" href="#">Get tickets <span class="arrow">→</span></a>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  var size = new URLSearchParams(location.search).get('size') || 'square';
  document.body.className = size;

  // Landscape needs a different DOM arrangement: restructure on the fly.
  if (size === 'landscape') {
    var inner = document.querySelector('.inner');
    var wrap  = document.querySelector('.vertical-only');
    var speaker = wrap.querySelector('.speaker');
    var avatar  = speaker.querySelector('.avatar');
    var who     = speaker.querySelector('.who');
    var title   = wrap.querySelector('.title');
    var foot    = wrap.querySelector('.foot');
    var meta    = foot.querySelector('.meta');
    var cta     = foot.querySelector('.cta');

    var body = document.createElement('div'); body.className = 'body';
    var left = document.createElement('div'); left.className = 'col-left';
    var right= document.createElement('div'); right.className = 'col-right';

    left.appendChild(title); left.appendChild(meta); left.appendChild(cta);
    right.appendChild(avatar); right.appendChild(who);
    body.appendChild(left); body.appendChild(right);

    wrap.remove();
    inner.appendChild(body);
  }

  // signal readiness once fonts + images are settled
  Promise.all([
    document.fonts.ready,
    ...Array.from(document.images).map(function(img){
      return img.complete ? Promise.resolve()
        : new Promise(function(r){ img.onload = img.onerror = r; });
    })
  ]).then(function(){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ document.documentElement.dataset.ready = '1'; });
    });
  });
})();
</script>
</body>
</html>
