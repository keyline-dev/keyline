<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaker Card</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('Inter.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }

  :root {
    --bg: #0F1226;
    --accent: #7C5CFF;
    --pad: 72px;
    --logo-h: 48px;
    --event: 26px;
    --portrait: 176px;
    --name: 38px;
    --role: 22px;
    --title: 60px;
    --meta: 22px;
    --btn: 22px;
    --btn-pad: 19px 38px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: #FFFFFF;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 100vw;
    height: 100vh;
    padding: var(--pad);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    background:
      radial-gradient(1100px 760px at 88% -12%, rgba(124, 92, 255, 0.30), transparent 62%),
      radial-gradient(820px 620px at -10% 108%, rgba(124, 92, 255, 0.17), transparent 64%),
      var(--bg);
  }

  /* hairline accent at the top edge */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--accent), rgba(124, 92, 255, 0.05));
  }

  /* ---------- header ---------- */
  .header {
    display: flex;
    align-items: center;
    gap: calc(var(--logo-h) * 0.42);
    flex: none;
  }
  .header img {
    height: var(--logo-h);
    width: auto;
    display: block;
  }
  .header .rule {
    width: 2px;
    height: calc(var(--logo-h) * 0.62);
    background: rgba(255, 255, 255, 0.22);
    flex: none;
  }
  .event-name {
    font-size: var(--event);
    font-weight: 700;
    letter-spacing: 0.15em;
    line-height: 1;
    white-space: nowrap;
  }

  /* ---------- body ---------- */
  .body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: calc(var(--pad) * 0.62);
    padding: calc(var(--pad) * 0.45) 0;
  }

  .main-col {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: calc(var(--pad) * 0.62);
  }
  .portrait-col { display: none; }

  .speaker {
    display: flex;
    align-items: center;
    gap: calc(var(--portrait) * 0.18);
    flex: none;
  }
  .portrait {
    width: var(--portrait);
    height: var(--portrait);
    flex: 0 0 auto;
    border-radius: 50%;
    overflow: hidden;
    background: #1b1f3d;
    box-shadow:
      0 0 0 3px rgba(124, 92, 255, 0.95),
      0 0 0 10px rgba(124, 92, 255, 0.18),
      0 18px 48px rgba(0, 0, 0, 0.42);
  }
  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 42%;
    display: block;
    border-radius: 50%;
  }
  .who { min-width: 0; }
  .who .name {
    font-size: var(--name);
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.14;
  }
  .who .role {
    margin-top: calc(var(--role) * 0.34);
    font-size: var(--role);
    font-weight: 500;
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.70);
  }

  .title {
    font-size: var(--title);
    font-weight: 800;
    line-height: 1.11;
    letter-spacing: -0.022em;
    text-wrap: balance;
    hyphens: none;
  }
  .title .hl { color: var(--accent); }

  /* ---------- footer ---------- */
  .footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: calc(var(--pad) * 0.5);
    padding-top: calc(var(--pad) * 0.42);
    border-top: 1px solid rgba(255, 255, 255, 0.14);
  }
  .meta {
    font-size: var(--meta);
    font-weight: 500;
    line-height: 1.35;
    color: rgba(255, 255, 255, 0.82);
  }
  .meta b { font-weight: 700; color: #fff; }
  .btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: var(--btn-pad);
    font-size: var(--btn);
    font-weight: 700;
    letter-spacing: 0.005em;
    line-height: 1;
    color: #fff;
    background: var(--accent);
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 12px 34px rgba(124, 92, 255, 0.36);
  }

  /* ================= LANDSCAPE 1920x1080 ================= */
  @media (min-aspect-ratio: 13/10) {
    :root {
      --pad: 88px;
      --logo-h: 52px;
      --event: 27px;
      --portrait: 440px;
      --name: 44px;
      --role: 24px;
      --title: 66px;
      --meta: 24px;
      --btn: 24px;
      --btn-pad: 21px 44px;
    }
    .body {
      flex-direction: row;
      align-items: center;
      gap: calc(var(--pad) * 0.95);
      padding: calc(var(--pad) * 0.4) 0;
    }
    .main-col {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: calc(var(--pad) * 0.52);
    }
    .portrait-col {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .speaker { gap: 0; }
    .speaker > .portrait { display: none; }
  }

  /* ================= STORY 1080x1920 ================= */
  @media (max-aspect-ratio: 7/10) {
    :root {
      --pad: 86px;
      --logo-h: 56px;
      --event: 29px;
      --portrait: 376px;
      --name: 54px;
      --role: 28px;
      --title: 84px;
      --meta: 27px;
      --btn: 28px;
      --btn-pad: 26px 56px;
    }
    .body {
      justify-content: center;
      gap: calc(var(--pad) * 0.85);
      padding: calc(var(--pad) * 0.6) 0;
    }
    .speaker {
      flex-direction: column;
      align-items: flex-start;
      gap: calc(var(--portrait) * 0.14);
    }
    .footer {
      flex-direction: column;
      align-items: flex-start;
      gap: calc(var(--pad) * 0.45);
      padding-top: calc(var(--pad) * 0.52);
    }
  }
</style>
</head>
<body>
  <div class="card">

    <div class="header">
      <img src="logo.svg" alt="Fieldnotes logo">
      <div class="rule"></div>
      <div class="event-name">FIELDNOTES CONF 2026</div>
    </div>

    <div class="body">
      <div class="main-col">
        <div class="speaker">
          <div class="portrait"><img src="portrait.png" alt="Maya Okonkwo-Lindqvist"></div>
          <div class="who">
            <div class="name">Maya Okonkwo-Lindqvist</div>
            <div class="role">Principal Engineer, Northwind&nbsp;Labs</div>
          </div>
        </div>

        <h1 class="title">Shipping at the speed of trust: what ten years of on-call taught us about resilient systems</h1>
      </div>

      <div class="portrait-col">
        <div class="portrait"><img src="portrait.png" alt="Maya Okonkwo-Lindqvist"></div>
      </div>
    </div>

    <div class="footer">
      <div class="meta"><b>November 14, 2026</b> &middot; Harbor Hall, Lisbon</div>
      <div class="btn">Get tickets</div>
    </div>

  </div>
</body>
</html>
