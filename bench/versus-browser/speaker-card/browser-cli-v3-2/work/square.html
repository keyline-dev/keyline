<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Square</title>
<link rel="stylesheet" href="base.css">
<style>
  .card { padding: 72px; gap: 0; justify-content: space-between; }

  .glow.a { width: 760px; height: 760px; top: -330px; right: -260px;
            background: radial-gradient(circle, rgba(124,92,255,.42) 0%, rgba(124,92,255,0) 68%); }
  .glow.b { width: 620px; height: 620px; bottom: -300px; left: -240px;
            background: radial-gradient(circle, rgba(124,92,255,.22) 0%, rgba(124,92,255,0) 70%); }

  .header { gap: 22px; }
  .header img { width: 160px; height: 48px; }
  .rule { width: 1px; height: 30px; }
  .event-name { font-size: 19px; letter-spacing: 0.17em; }

  .middle { display: flex; flex-direction: column; gap: 52px; }

  .speaker { display: flex; align-items: center; gap: 28px; }
  .portrait { width: 148px; --ring: 5px; }
  .speaker-name { font-size: 34px; }
  .speaker-role { font-size: 20px; margin-top: 7px; }

  .kicker { font-size: 15px; margin-bottom: 22px; }
  .title { font-size: 57px; }

  .footer { display: flex; align-items: center; justify-content: space-between; gap: 36px; }
  .meta { font-size: 21px; }
  .btn { font-size: 20px; padding: 21px 40px; }
</style>
</head>
<body>
<div class="card">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="grid-lines"></div>

  <header class="header">
    <img src="logo.svg" alt="">
    <div class="rule"></div>
    <div class="event-name">Fieldnotes Conf 2026</div>
  </header>

  <div class="middle">
    <div class="speaker">
      <div class="portrait"></div>
      <div>
        <div class="speaker-name">Maya Okonkwo-Lindqvist</div>
        <div class="speaker-role">Principal Engineer, Northwind Labs</div>
      </div>
    </div>

    <div class="talk">
      <div class="kicker">Keynote</div>
      <h1 class="title">Shipping at the speed of trust: what ten years of on-call taught us about resilient systems</h1>
    </div>
  </div>

  <footer class="footer">
    <div class="meta"><b>November 14, 2026</b> &middot; Harbor Hall, Lisbon</div>
    <a class="btn">Get tickets
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </footer>
</div>
</body>
</html>
