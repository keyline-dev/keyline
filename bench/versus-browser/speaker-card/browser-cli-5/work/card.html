<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaker Card</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("Inter.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }

  :root {
    --bg: #0F1226;
    --accent: #7C5CFF;
    --ink: #FFFFFF;
    --muted: rgba(255,255,255,0.68);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .card {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(124,92,255,0.30) 0%, rgba(124,92,255,0.05) 42%, rgba(15,18,38,0) 70%),
      radial-gradient(90% 70% at 0% 100%, rgba(124,92,255,0.18) 0%, rgba(15,18,38,0) 60%),
      var(--bg);
    display: flex;
    flex-direction: column;
  }

  /* decorative accent bar */
  .card::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: var(--barh, 10px);
    background: linear-gradient(90deg, var(--accent) 0%, #B49BFF 55%, #FFFFFF 100%);
  }

  .inner {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: var(--pad);
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: var(--logo-gap);
    flex: none;
  }
  header img { display: block; width: var(--logo-w); height: auto; }
  .divider {
    width: 2px;
    height: var(--logo-rule);
    background: rgba(255,255,255,0.22);
    border-radius: 2px;
    flex: none;
  }
  .event {
    font-size: var(--event-fs);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink);
  }

  /* ---------- layout skeleton (base = square / story) ---------- */
  .body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .left { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .right { display: none; }

  /* ---------- eyebrow ---------- */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.6em;
    font-size: var(--eyebrow-fs);
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }
  .eyebrow::before {
    content: "";
    width: 2.4em;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* ---------- title ---------- */
  h1 {
    font-size: var(--title-fs);
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1 .hl { color: var(--accent); }

  /* ---------- portrait ---------- */
  .portrait {
    position: relative;
    width: var(--pw);
    height: var(--pw);
    flex: none;
    border-radius: 50%;
    padding: var(--ring);
    background: linear-gradient(145deg, var(--accent), #ffffff 130%);
    box-shadow: 0 24px 70px rgba(0,0,0,0.45);
  }
  .portrait img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    background: #1a1e3c;
  }

  /* ---------- speaker ---------- */
  .speaker {
    display: flex;
    align-items: center;
    gap: var(--sp-gap);
    flex: none;
  }
  .speaker-text { min-width: 0; }
  .sname {
    font-size: var(--name-fs);
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.12;
  }
  .srole {
    margin-top: var(--role-mt);
    font-size: var(--role-fs);
    font-weight: 500;
    line-height: 1.25;
    color: var(--muted);
  }

  /* ---------- footer ---------- */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--foot-gap);
    flex: none;
  }
  .meta {
    font-size: var(--meta-fs);
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
  }
  .meta .dot { color: var(--accent); }
  .btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #FFFFFF;
    font-size: var(--btn-fs);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    padding: var(--btn-py) var(--btn-px);
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 14px 40px rgba(124,92,255,0.40);
  }

  /* ===================================================================
     SQUARE — 1080 x 1080 (master)
     =================================================================== */
  @media (min-aspect-ratio: 9/10) and (max-aspect-ratio: 11/10) {
    .card { --barh: 12px; }
    .inner {
      --pad: 74px 74px 86px;
      --logo-w: 150px; --logo-gap: 22px; --logo-rule: 38px; --event-fs: 21px;
      --eyebrow-fs: 17px;
      --title-fs: 63px;
      --pw: 156px; --ring: 6px;
      --sp-gap: 30px; --name-fs: 37px; --role-fs: 23px; --role-mt: 7px;
      --meta-fs: 22px; --foot-gap: 32px;
      --btn-fs: 22px; --btn-px: 40px; --btn-py: 22px;
    }
    .body { margin-top: 44px; }
    .left { justify-content: center; }
    h1 { margin-top: 22px; }
    .speaker { margin-top: 72px; }
    footer { margin-top: 40px; padding-top: 34px; border-top: 2px solid rgba(255,255,255,0.12); }
  }

  /* ===================================================================
     LANDSCAPE — 1920 x 1080
     =================================================================== */
  @media (min-aspect-ratio: 11/10) {
    .card { --barh: 12px; }
    .inner {
      --pad: 76px 90px 88px;
      --logo-w: 168px; --logo-gap: 26px; --logo-rule: 42px; --event-fs: 23px;
      --eyebrow-fs: 18px;
      --title-fs: 68px;
      --pw: 470px; --ring: 11px;
      --sp-gap: 30px; --name-fs: 40px; --role-fs: 24px; --role-mt: 8px;
      --meta-fs: 24px; --foot-gap: 40px;
      --btn-fs: 24px; --btn-px: 46px; --btn-py: 25px;
    }
    .body {
      flex-direction: row;
      align-items: center;
      gap: 84px;
      margin-top: 28px;
    }
    .left { flex: 1 1 auto; justify-content: center; }
    .right { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { margin-top: 24px; }
    .speaker { margin-top: 52px; }
    footer { margin-top: 36px; padding-top: 36px; border-top: 2px solid rgba(255,255,255,0.12); }
  }

  /* ===================================================================
     STORY — 1080 x 1920
     =================================================================== */
  @media (max-aspect-ratio: 9/10) {
    .card { --barh: 14px; }
    .inner {
      --pad: 110px 82px 130px;
      --logo-w: 176px; --logo-gap: 26px; --logo-rule: 44px; --event-fs: 24px;
      --eyebrow-fs: 20px;
      --title-fs: 78px;
      --pw: 420px; --ring: 11px;
      --sp-gap: 34px; --name-fs: 46px; --role-fs: 28px; --role-mt: 10px;
      --meta-fs: 28px; --foot-gap: 36px;
      --btn-fs: 28px; --btn-px: 56px; --btn-py: 30px;
    }
    header { justify-content: flex-start; }
    .portrait-wrap { display: flex; justify-content: center; margin-top: 84px; }
    .left { justify-content: center; }
    .body { margin-top: 24px; }
    h1 { margin-top: 26px; }
    .speaker { margin-top: 76px; flex-direction: column; align-items: flex-start; gap: 0; }
    .speaker .portrait { display: none; }
    footer {
      margin-top: auto;
      padding-top: 46px;
      border-top: 2px solid rgba(255,255,255,0.12);
      flex-direction: column;
      align-items: flex-start;
      gap: 40px;
    }
    .btn { width: 100%; }
  }

  /* hide the standalone portrait block on square/landscape */
  @media (min-aspect-ratio: 9/10) {
    .portrait-wrap { display: none; }
  }
  /* on landscape the speaker row has no avatar (big one on the right) */
  @media (min-aspect-ratio: 11/10) {
    .speaker .portrait { display: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">

      <header>
        <img src="logo.svg" alt="Fieldnotes Conf logo">
        <div class="divider"></div>
        <div class="event">Fieldnotes Conf 2026</div>
      </header>

      <div class="portrait-wrap">
        <div class="portrait"><img src="portrait.png" alt="Maya Okonkwo-Lindqvist"></div>
      </div>

      <div class="body">
        <div class="left">
          <div><span class="eyebrow">Keynote</span></div>
          <h1>Shipping at the speed of <span class="hl">trust</span>: what ten years of on-call taught us about resilient systems</h1>

          <div class="speaker">
            <div class="portrait"><img src="portrait.png" alt="Maya Okonkwo-Lindqvist"></div>
            <div class="speaker-text">
              <div class="sname">Maya Okonkwo-Lindqvist</div>
              <div class="srole">Principal Engineer, Northwind Labs</div>
            </div>
          </div>
        </div>

        <div class="right">
          <div class="portrait"><img src="portrait.png" alt="Maya Okonkwo-Lindqvist"></div>
        </div>
      </div>

      <footer>
        <div class="meta">November 14, 2026 <span class="dot">·</span> Harbor Hall, Lisbon</div>
        <div class="btn">Get tickets</div>
      </footer>

    </div>
  </div>
</body>
</html>
