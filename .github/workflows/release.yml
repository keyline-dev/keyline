name: Release

# Push a tag like v0.1.0 to build and attach to a GitHub release: for Linux
# (x86_64 and arm64) a .deb (install with `sudo apt install ./keyline-mcp_*.deb`)
# and a tarball of the binary; for macOS (Apple silicon) a tarball.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # 22.04's older glibc keeps the binary working on newer distros too.
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
          # ponytail: Apple silicon only; add macos-15-intel if anyone needs x86_64.
          - { os: macos, arch: arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - name: Build the .deb (and the release binary)
        if: matrix.os == 'linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb
      - name: Build the release binary
        if: matrix.os == 'macos'
        run: cargo build --release --locked
      - name: Tarball
        run: |
          name=keyline-mcp-${GITHUB_REF_NAME}-${{ matrix.os }}-${{ matrix.arch }}
          mkdir "$name"
          cp target/release/keyline-mcp LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/debian/*.deb
            *.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            $(find . -name '*.deb' -o -name '*.tar.gz')
