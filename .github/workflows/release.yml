name: Release

# Push a tag like v0.1.0 to build and attach to a GitHub release: for Linux
# (x86_64 and arm64) a .deb (install with `sudo apt install ./keyline-mcp_*.deb`)
# and a tarball of the binary; for macOS (Apple silicon) a tarball. Every
# file is listed in SHA256SUMS and gets a build provenance attestation
# (`gh attestation verify <file> --repo keyline-dev/keyline`).
on:
  push:
    # Full versions only: a moving tag like `v0` (for the GitHub Action)
    # must not start a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches Cargo.toml and the plugin
        run: |
          want="v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          for f in plugin/.claude-plugin/plugin.json mcpb/manifest.json; do
            got="v$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$f" | head -n 1)"
            if [ "$got" != "$want" ]; then
              echo "::error::$f says $got, Cargo.toml $want: make them agree"
              exit 1
            fi
          done
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $want: bump the version first"
            exit 1
          fi

  build:
    needs: version
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # 22.04's older glibc keeps the binary working on newer distros too.
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
          # ponytail: Apple silicon only; add macos-15-intel if anyone needs x86_64.
          - { os: macos, arch: arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - name: Build the .deb (and the release binary)
        if: matrix.os == 'linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb
      - name: Build the release binary
        if: matrix.os == 'macos'
        run: cargo build --release --locked
      - name: Tarball
        run: |
          name=keyline-mcp-${GITHUB_REF_NAME}-${{ matrix.os }}-${{ matrix.arch }}
          mkdir "$name"
          cp target/release/keyline-mcp LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/debian/*.deb
            *.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Flatten
        working-directory: dist
        run: |
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -empty -delete
      # Claude Desktop's extension: the macOS binary with mcpb/manifest.json.
      - name: Claude Desktop bundle (.mcpb)
        run: |
          name=keyline-mcp-$GITHUB_REF_NAME-macos-arm64
          mkdir -p bundle/server
          tar xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/$name/keyline-mcp" bundle/server/
          cp mcpb/manifest.json LICENSE bundle/
          npx -y @anthropic-ai/mcpb validate bundle/manifest.json
          npx -y @anthropic-ai/mcpb pack bundle "dist/keyline-mcp-${GITHUB_REF_NAME#v}.mcpb"
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.deb *.tar.gz *.mcpb > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes dist/*

  # The Claude Code plugin's launcher, run as a user would on each platform:
  # no keyline-mcp on the PATH, so it downloads this release, checks it
  # against SHA256SUMS and starts it.
  plugin:
    needs: release
    name: plugin-${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: The launcher downloads, verifies and starts the server
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          reply=$(echo "$init" | env -i HOME="$HOME" PATH=/usr/bin:/bin \
            CLAUDE_PLUGIN_ROOT="$PWD/plugin" CLAUDE_PLUGIN_DATA="$RUNNER_TEMP/plugin-data" \
            sh plugin/scripts/launch.sh --data "$RUNNER_TEMP/data" | head -n 1)
          echo "$reply"
          echo "$reply" | grep -q '"serverInfo"'

  # The Claude Desktop bundle as Claude Desktop unpacks and starts it, with
  # no folders picked and motion on.
  desktop:
    needs: release
    runs-on: macos-latest
    steps:
      - name: The bundle's server starts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.mcpb' --pattern SHA256SUMS
          shasum -a 256 --check --ignore-missing SHA256SUMS
          unzip -q keyline-mcp-*.mcpb -d bundle
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          reply=$(echo "$init" | bundle/server/keyline-mcp --no-motion=false --allow-read "" --data "$RUNNER_TEMP/data" | head -n 1)
          echo "$reply"
          echo "$reply" | grep -q '"serverInfo"'

  # The container image, from the release's own Linux binaries: :X.Y.Z and
  # :latest with ffmpeg, :X.Y.Z-stills and :stills without.
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: The release's Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in amd64 arm64; do
            name=keyline-mcp-$GITHUB_REF_NAME-linux-$arch
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$name.tar.gz"
            tar xzf "$name.tar.gz"
            mkdir -p "bin/$arch"
            mv "$name/keyline-mcp" "bin/$arch/"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          image=ghcr.io/keyline-dev/keyline-mcp
          v=${GITHUB_REF_NAME#v}
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -t "$image:$v" -t "$image:latest" .
          docker buildx build --push --platform linux/amd64,linux/arm64 --build-arg VIDEO=false \
            -t "$image:$v-stills" -t "$image:stills" .
      - name: The published image answers MCP
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          reply=$(echo "$init" | docker run -i --rm "ghcr.io/keyline-dev/keyline-mcp:${GITHUB_REF_NAME#v}" | head -n 1)
          echo "$reply"
          echo "$reply" | grep -q '"serverInfo"'
