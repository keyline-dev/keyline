name: keyline render
description: Render keyline scene files to images and video at every size, and fail on a broken design
author: keyline
branding:
  icon: image
  color: blue

inputs:
  scenes:
    description: Scene files to render, as a glob (e.g. campaigns/*.json)
    required: true
  out:
    description: Folder for the files; each scene gets a folder named after it
    default: renders
  args:
    description: More flags for keyline-mcp render, e.g. "--format webp --size wide"
    default: ""
  version:
    description: The keyline release to use
    default: "0.5.0"

runs:
  using: composite
  steps:
    - name: Install keyline-mcp ${{ inputs.version }}
      shell: bash
      env:
        V: ${{ inputs.version }}
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=linux-amd64 ;;
          Linux-ARM64) target=linux-arm64 ;;
          macOS-ARM64) target=macos-arm64 ;;
          *) echo "::error::keyline has no release for $RUNNER_OS $RUNNER_ARCH"; exit 1 ;;
        esac
        name=keyline-mcp-v$V-$target
        dir="$RUNNER_TEMP/keyline"
        mkdir -p "$dir"
        cd "$dir"
        url=https://github.com/keyline-dev/keyline/releases/download/v$V
        curl -fsSL "$url/$name.tar.gz" -o "$name.tar.gz"
        curl -fsSL "$url/SHA256SUMS" -o SHA256SUMS
        grep " $name.tar.gz\$" SHA256SUMS > want
        if command -v sha256sum > /dev/null; then sha256sum -c want; else shasum -a 256 -c want; fi
        tar xzf "$name.tar.gz"
        echo "$dir/$name" >> "$GITHUB_PATH"
    - name: Render
      shell: bash
      env:
        SCENES: ${{ inputs.scenes }}
        OUT: ${{ inputs.out }}
        ARGS: ${{ inputs.args }}
      run: |
        shopt -s nullglob
        shopt -s globstar 2> /dev/null || true  # ** needs bash 4
        # Every scene renders, then the step fails if any had a ! defect.
        status=0 found=0
        for scene in $SCENES; do
          found=1
          name=$(basename "$scene" .json)
          echo "::group::$scene"
          keyline-mcp render "$scene" --out "$OUT/$name" --renderer cpu $ARGS || status=1
          echo "::endgroup::"
        done
        if [ "$found" = 0 ]; then echo "::error::no scene matches $SCENES"; exit 1; fi
        exit $status
